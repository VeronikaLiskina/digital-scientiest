services:
  db:
    image: pgvector/pgvector:pg16
    container_name: digital_scientist_db
    environment:
      POSTGRES_DB: digital_scientist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nika
    ports:
      - "55432:5432"
    volumes:
      - digital_scientist_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: digital_scientist_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads
      - huggingface_cache:/root/.cache/huggingface

  frontend:
    build: ./frontend
    container_name: digital_scientist_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  digital_scientist_pgdata:
  huggingface_cache:
